<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymFit - Inicio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">GYMFIT</a>

        <div>
            <a class="btn btn-outline-light btn-sm" href="/">Inicio</a>
            <a class="btn btn-outline-light btn-sm" href="/clientes">Clientes</a>
            <a class="btn btn-outline-light btn-sm" href="/membresias">Membresías</a>
            <a class="btn btn-outline-light btn-sm" href="/entrenadores">Entrenadores</a>
            <a class="btn btn-outline-light btn-sm" href="/reservas">Reservas</a>
            <a class="btn btn-outline-light btn-sm" href="/graficos">Gráficos</a>
        </div>
    </div>
</nav>

<div class="container mt-5">

    <div class="bg-dark text-white p-5 rounded-4">
        <h1>Gimnasio GymFit</h1>

        <p class="lead">
            Sistema web para la gestión de clientes,
            membresías, entrenadores y reservas.
        </p>

        <a href="/clientes" class="btn btn-primary">
            Gestionar clientes
        </a>
    </div>

    <h2 class="mt-5 mb-4">Resumen del sistema</h2>

    <div class="row">

        <div class="col-md-3">
            <div class="card text-center shadow">
                <div class="card-body">
                    <h2 th:text="${clientes}">0</h2>
                    <p>Clientes</p>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card text-center shadow">
                <div class="card-body">
                    <h2 th:text="${membresias}">0</h2>
                    <p>Membresías</p>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card text-center shadow">
                <div class="card-body">
                    <h2 th:text="${entrenadores}">0</h2>
                    <p>Entrenadores</p>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card text-center shadow">
                <div class="card-body">
                    <h2 th:text="${reservas}">0</h2>
                    <p>Reservas</p>
                </div>
            </div>
        </div>

    </div>

</div>

<script th:src="@{/js/scripts.js}"></script>
</body>
</html>
