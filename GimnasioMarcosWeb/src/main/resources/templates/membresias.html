<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Membresías - GymFit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">GYMFIT</a>
        <div>
            <a class="btn btn-outline-light btn-sm" href="/">Inicio</a>
            <a class="btn btn-outline-light btn-sm" href="/clientes">Clientes</a>
            <a class="btn btn-primary btn-sm" href="/membresias">Membresías</a>
            <a class="btn btn-outline-light btn-sm" href="/entrenadores">Entrenadores</a>
            <a class="btn btn-outline-light btn-sm" href="/reservas">Reservas</a>
            <a class="btn btn-outline-light btn-sm" href="/graficos">Gráficos</a>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <h1>Gestión de Membresías</h1>

    <div class="card mt-4 shadow">
        <div class="card-header bg-primary text-white">
            Registrar membresía
        </div>

        <div class="card-body">

            <form action="/membresias/guardar" method="post">

                <div class="row">

                    <div class="col-md-2">
                        <label>ID</label>
                        <input type="number" name="id" class="form-control" required>
                    </div>

                    <div class="col-md-4">
                        <label>Nombre</label>
                        <input type="text" name="nombre" class="form-control" required>
                    </div>

                    <div class="col-md-3">
                        <label>Precio</label>
                        <input type="number" step="0.01" name="precio" class="form-control" required>
                    </div>

                    <div class="col-md-3">
                        <label>Duración (meses)</label>
                        <input type="number" name="duracion" class="form-control" required>
                    </div>

                    <div class="col-md-12 mt-3">
                        <label>Beneficios</label>
                        <input type="text" name="beneficios" class="form-control" required>
                    </div>

                </div>

                <button type="submit" class="btn btn-success mt-3">
                    Registrar membresía
                </button>

            </form>

        </div>
    </div>

    <div class="card mt-4 shadow">
        <div class="card-header">
            Membresías registradas
        </div>

        <div class="card-body">

            <table class="table table-striped">

                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Precio</th>
                        <th>Duración</th>
                        <th>Beneficios</th>
                        <th>Acción</th>
                    </tr>
                </thead>

                <tbody>

                    <tr th:each="membresia : ${membresias}">
                        <td th:text="${membresia.id}"></td>
                        <td th:text="${membresia.nombre}"></td>
                        <td th:text="${membresia.precio}"></td>
                        <td th:text="${membresia.duracion} + ' meses'"></td>
                        <td th:text="${membresia.beneficios}"></td>

                        <td>
                            <a th:href="@{/membresias/eliminar/{id}(id=${membresia.id})}"
                               class="btn btn-danger btn-sm btn-eliminar">
                                Eliminar
                            </a>
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>
    </div>

</div>

<script th:src="@{/js/scripts.js}"></script>
</body>
</html>
