<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estadísticas - GymFit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">GYMFIT</a>

        <div>
            <a class="btn btn-outline-light btn-sm" href="/">Inicio</a>
            <a class="btn btn-outline-light btn-sm" href="/clientes">Clientes</a>
            <a class="btn btn-outline-light btn-sm" href="/membresias">Membresías</a>
            <a class="btn btn-outline-light btn-sm" href="/entrenadores">Entrenadores</a>
            <a class="btn btn-outline-light btn-sm" href="/reservas">Reservas</a>
            <a class="btn btn-outline-light btn-sm" href="/graficos">Gráficos</a>
        </div>
    </div>
</nav>

<div class="container mt-5">

    <h1>Estadísticas del sistema</h1>

    <div class="row mt-4">

        <div class="col-md-3">
            <div class="card shadow text-center">
                <div class="card-body">
                    <h2 th:text="${clientes}"></h2>
                    <p>Clientes registrados</p>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow text-center">
                <div class="card-body">
                    <h2 th:text="${membresias}"></h2>
                    <p>Membresías</p>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow text-center">
                <div class="card-body">
                    <h2 th:text="${entrenadores}"></h2>
                    <p>Entrenadores</p>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow text-center">
                <div class="card-body">
                    <h2 th:text="${reservas}"></h2>
                    <p>Reservas</p>
                </div>
            </div>
        </div>

    </div>

    <div class="text-center mt-5">
        <a href="/graficos" class="btn btn-primary">
            Ver gráfico
        </a>
    </div>

</div>

<script th:src="@{/js/scripts.js}"></script>
</body>
</html>
