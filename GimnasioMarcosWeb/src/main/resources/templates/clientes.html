<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes - GymFit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">GYMFIT</a>

        <div>
            <a class="btn btn-outline-light btn-sm" href="/">Inicio</a>
            <a class="btn btn-primary btn-sm" href="/clientes">Clientes</a>
            <a class="btn btn-outline-light btn-sm" href="/membresias">Membresías</a>
            <a class="btn btn-outline-light btn-sm" href="/entrenadores">Entrenadores</a>
            <a class="btn btn-outline-light btn-sm" href="/reservas">Reservas</a>
            <a class="btn btn-outline-light btn-sm" href="/graficos">Gráficos</a>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <h1>Gestión de Clientes</h1>

    <div class="card mt-4 shadow">

        <div class="card-header bg-primary text-white">
            Registrar cliente
        </div>

        <div class="card-body">

            <form action="/clientes/guardar" method="post">

                <div class="row">

                    <div class="col-md-2">
                        <label>ID</label>
                        <input type="number" name="id" class="form-control" required>
                    </div>

                    <div class="col-md-5">
                        <label>Nombre</label>
                        <input type="text" name="nombre" class="form-control" required>
                    </div>

                    <div class="col-md-5">
                        <label>Apellido</label>
                        <input type="text" name="apellido" class="form-control" required>
                    </div>

                    <div class="col-md-4 mt-3">
                        <label>DNI</label>
                        <input type="text" name="dni" class="form-control" required>
                    </div>

                    <div class="col-md-4 mt-3">
                        <label>Teléfono</label>
                        <input type="text" name="telefono" class="form-control" required>
                    </div>

                    <div class="col-md-4 mt-3">
                        <label>Correo</label>
                        <input type="email" name="correo" class="form-control" required>
                    </div>

                </div>

                <button type="submit" class="btn btn-success mt-3">
                    Registrar cliente
                </button>

            </form>

        </div>

    </div>

<div class="card mt-4 shadow">

    <div class="card-header bg-info text-white">
        Buscar cliente
    </div>

    <div class="card-body">

        <form action="/clientes/buscar" method="get" class="row">

            <div class="col-md-4">
                <label>ID del cliente</label>
                <input type="number" name="id" class="form-control" required>
            </div>

            <div class="col-md-2 d-flex align-items-end">
                <button type="submit" class="btn btn-info">
                    Buscar
                </button>
            </div>

        </form>

    </div>

</div>

    <div class="card mt-4 shadow">

        <div class="card-header">
            Clientes registrados
        </div>

        <div class="card-body">

            <table class="table table-striped">

                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Apellido</th>
                        <th>DNI</th>
                        <th>Teléfono</th>
                        <th>Correo</th>
                        <th>Acción</th>
                    </tr>
                </thead>

                <tbody>

                    <tr th:each="cliente : ${clientes}">

                        <td th:text="${cliente.id}"></td>
                        <td th:text="${cliente.nombre}"></td>
                        <td th:text="${cliente.apellido}"></td>
                        <td th:text="${cliente.dni}"></td>
                        <td th:text="${cliente.telefono}"></td>
                        <td th:text="${cliente.correo}"></td>

                        <td>
                            <a th:href="@{/clientes/eliminar/{id}(id=${cliente.id})}"
                               class="btn btn-danger btn-sm btn-eliminar">
                                Eliminar
                            </a>
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

<script th:src="@{/js/scripts.js}"></script>

</body>
</html>
