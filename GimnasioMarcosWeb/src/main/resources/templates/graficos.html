<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gráficos - GymFit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">GYMFIT</a>
        <div>
            <a class="btn btn-outline-light btn-sm" href="/">Inicio</a>
            <a class="btn btn-outline-light btn-sm" href="/clientes">Clientes</a>
            <a class="btn btn-outline-light btn-sm" href="/membresias">Membresías</a>
            <a class="btn btn-outline-light btn-sm" href="/entrenadores">Entrenadores</a>
            <a class="btn btn-outline-light btn-sm" href="/reservas">Reservas</a>
            <a class="btn btn-primary btn-sm" href="/graficos">Gráficos</a>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <h1>Estadísticas del Gimnasio</h1>

    <div class="card shadow mt-4">
        <div class="card-header bg-primary text-white">
            Gráfico de barras
        </div>
        <div class="card-body">
            <canvas id="graficoBarras"></canvas>
        </div>
    </div>

    <div class="card shadow mt-4">
        <div class="card-header bg-success text-white">
            Gráfico lineal
        </div>
        <div class="card-body">
            <canvas id="graficoLineal"></canvas>
        </div>
    </div>

    <div class="card shadow mt-4 mb-4">
        <div class="card-header bg-warning">
            Gráfico circular
        </div>
        <div class="card-body">
            <canvas id="graficoCircular"></canvas>
        </div>
    </div>

</div>

<script th:inline="javascript">

    let clientes = /*[[${clientes}]]*/ 0;
    let membresias = /*[[${membresias}]]*/ 0;
    let entrenadores = /*[[${entrenadores}]]*/ 0;
    let reservas = /*[[${reservas}]]*/ 0;

    new Chart(document.getElementById("graficoBarras"), {
        type: "bar",
        data: {
            labels: [
                "Clientes",
                "Membresías",
                "Entrenadores",
                "Reservas"
            ],
            datasets: [{
                label: "Cantidad registrada",
                data: [
                    clientes,
                    membresias,
                    entrenadores,
                    reservas
                ]
            }]
        },
        options: {
            responsive: true,
            scales: {
                y: {
                    beginAtZero: true
                }
            }
        }
    });

    new Chart(document.getElementById("graficoLineal"), {
        type: "line",
        data: {
            labels: [
                "Clientes",
                "Membresías",
                "Entrenadores",
                "Reservas"
            ],
            datasets: [{
                label: "Cantidad registrada",
                data: [
                    clientes,
                    membresias,
                    entrenadores,
                    reservas
                ],
                fill: false,
                tension: 0.3
            }]
        },
        options: {
            responsive: true,
            scales: {
                y: {
                    beginAtZero: true
                }
            }
        }
    });

    new Chart(document.getElementById("graficoCircular"), {
        type: "pie",
        data: {
            labels: [
                "Clientes",
                "Membresías",
                "Entrenadores",
                "Reservas"
            ],
            datasets: [{
                label: "Cantidad registrada",
                data: [
                    clientes,
                    membresias,
                    entrenadores,
                    reservas
                ]
            }]
        },
        options: {
            responsive: true
        }
    });

</script>

<script th:src="@{/js/scripts.js}"></script>
</body>
</html>
