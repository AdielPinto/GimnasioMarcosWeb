<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservas - GymFit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">GYMFIT</a>
        <div>
            <a class="btn btn-outline-light btn-sm" href="/">Inicio</a>
            <a class="btn btn-outline-light btn-sm" href="/clientes">Clientes</a>
            <a class="btn btn-outline-light btn-sm" href="/membresias">Membresías</a>
            <a class="btn btn-outline-light btn-sm" href="/entrenadores">Entrenadores</a>
            <a class="btn btn-primary btn-sm" href="/reservas">Reservas</a>
            <a class="btn btn-outline-light btn-sm" href="/graficos">Gráficos</a>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <h1>Gestión de Reservas</h1>

    <div class="card mt-4 shadow">

        <div class="card-header bg-primary text-white">
            Registrar reserva
        </div>

        <div class="card-body">

            <form action="/reservas/guardar" method="post">

                <div class="row">

                    <div class="col-md-2">
                        <label>ID</label>
                        <input type="number" name="id" class="form-control" required>
                    </div>

                    <div class="col-md-5">
                        <label>Cliente</label>
                        <input type="text" name="cliente" class="form-control" required>
                    </div>

                    <div class="col-md-5">
                        <label>Entrenador</label>
                        <input type="text" name="entrenador" class="form-control" required>
                    </div>

                    <div class="col-md-4 mt-3">
                        <label>Fecha</label>
                        <input type="date" name="fecha" class="form-control" required>
                    </div>

                    <div class="col-md-4 mt-3">
                        <label>Hora</label>
                        <input type="time" name="hora" class="form-control" required>
                    </div>

                    <div class="col-md-4 mt-3">
                        <label>Estado</label>
                        <select name="estado" class="form-select">
                            <option>Confirmada</option>
                            <option>Pendiente</option>
                            <option>Cancelada</option>
                        </select>
                    </div>

                </div>

                <button type="submit" class="btn btn-success mt-3">
                    Registrar reserva
                </button>

            </form>

        </div>
    </div>

    <div class="card mt-4 shadow">

        <div class="card-header">
            Reservas registradas
        </div>

        <div class="card-body">

            <table class="table table-striped">

                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Cliente</th>
                        <th>Entrenador</th>
                        <th>Fecha</th>
                        <th>Hora</th>
                        <th>Estado</th>
                        <th>Acción</th>
                    </tr>
                </thead>

                <tbody>

                    <tr th:each="reserva : ${reservas}">
                        <td th:text="${reserva.id}"></td>
                        <td th:text="${reserva.cliente}"></td>
                        <td th:text="${reserva.entrenador}"></td>
                        <td th:text="${reserva.fecha}"></td>
                        <td th:text="${reserva.hora}"></td>
                        <td th:text="${reserva.estado}"></td>

                        <td>
                            <a th:href="@{/reservas/eliminar/{id}(id=${reserva.id})}"
                               class="btn btn-danger btn-sm btn-eliminar">
                                Eliminar
                            </a>
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>
    </div>

</div>

<script th:src="@{/js/scripts.js}"></script>
</body>
</html>
